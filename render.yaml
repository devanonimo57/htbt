services:
  - type: web
    name: hotbot-saas
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: ohio
    disk:
      name: hotbot-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/hotbot.db

